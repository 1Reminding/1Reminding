<svg xmlns="http://www.w3.org/2000/svg" width="920" height="430" viewBox="0 0 920 430" role="img" aria-labelledby="title description">
  <title id="title">Historical global visitor reach</title>
  <desc id="description">An illustrative reconstruction of historical profile visitors distributed across world regions.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0d1117"/>
      <stop offset="0.55" stop-color="#101525"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="land" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#26334d"/>
      <stop offset="1" stop-color="#172033"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#22d3ee" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <filter id="dot-glow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#30363d" stroke-opacity="0.28"/>
    </pattern>
  </defs>

  <rect width="920" height="430" rx="20" fill="url(#bg)"/>
  <rect width="920" height="430" rx="20" fill="url(#grid)"/>
  <circle cx="735" cy="210" r="210" fill="url(#glow)" opacity="0.45"/>
  <rect x="1" y="1" width="918" height="428" rx="19" fill="none" stroke="#30363d"/>

  <text x="34" y="43" fill="#f0f6fc" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="750" letter-spacing="0.6">HISTORICAL GLOBAL REACH</text>
  <text x="34" y="66" fill="#8b949e" font-family="Segoe UI,Arial,sans-serif" font-size="12">Illustrative reconstruction of the legacy visitor footprint</text>
  <g transform="translate(690 27)" font-family="Segoe UI,Arial,sans-serif">
    <rect width="196" height="48" rx="12" fill="#161b22" stroke="#30363d"/>
    <text x="16" y="21" fill="#8b949e" font-size="10" font-weight="700" letter-spacing="1">HISTORICAL BASELINE</text>
    <text x="16" y="40" fill="#22d3ee" font-size="17" font-weight="750">1.2K+ visits · 18 regions</text>
  </g>

  <g transform="translate(25 86)" fill="url(#land)" stroke="#3a4965" stroke-width="1.2">
    <!-- North America -->
    <path d="M60 70 L91 42 L150 36 L196 53 L228 86 L212 110 L177 111 L159 137 L125 135 L106 115 L78 106 Z"/>
    <path d="M174 139 L203 142 L218 162 L203 178 L184 166 Z"/>
    <!-- South America -->
    <path d="M207 183 L241 177 L270 199 L273 234 L257 268 L239 306 L220 290 L216 252 L199 215 Z"/>
    <!-- Europe -->
    <path d="M410 79 L435 61 L471 62 L489 81 L475 100 L450 94 L429 108 L407 97 Z"/>
    <!-- Africa -->
    <path d="M425 119 L470 108 L506 133 L501 179 L475 231 L446 222 L430 184 L405 148 Z"/>
    <path d="M505 220 L518 236 L509 261 L497 241 Z"/>
    <!-- Asia -->
    <path d="M482 77 L523 51 L590 46 L642 61 L697 55 L750 82 L799 92 L811 117 L773 137 L742 132 L712 157 L674 151 L646 173 L615 153 L585 165 L554 141 L514 132 L486 105 Z"/>
    <path d="M641 177 L664 183 L677 211 L659 223 L646 204 Z"/>
    <path d="M713 167 L732 177 L724 196 L707 186 Z"/>
    <!-- Australia and islands -->
    <path d="M731 239 L770 224 L807 240 L815 271 L788 294 L749 287 L726 263 Z"/>
    <path d="M823 294 L842 300 L849 316 L831 311 Z"/>
    <!-- Greenland -->
    <path d="M253 28 L294 20 L315 38 L299 67 L266 62 L247 45 Z"/>
  </g>

  <g fill="none" stroke="#22d3ee" stroke-opacity="0.24" stroke-width="1.2" stroke-dasharray="4 6">
    <path d="M676 225 Q466 105 154 190"/>
    <path d="M676 225 Q535 105 471 182"/>
    <path d="M676 225 Q611 315 477 285"/>
    <path d="M676 225 Q754 267 794 343"/>
    <path d="M676 225 Q405 327 257 319"/>
  </g>

  <g fill="#22d3ee" stroke="#bff7ff" stroke-width="1" filter="url(#dot-glow)">
    <circle cx="676" cy="225" r="7"/>
    <circle cx="715" cy="214" r="4.5"/><circle cx="742" cy="211" r="4"/>
    <circle cx="618" cy="244" r="4"/><circle cx="646" cy="285" r="3.5"/>
    <circle cx="606" cy="201" r="3.5"/><circle cx="767" cy="249" r="3.5"/>
    <circle cx="794" cy="343" r="5"/>
    <circle cx="471" cy="182" r="5"/><circle cx="451" cy="179" r="4"/>
    <circle cx="433" cy="181" r="3.5"/><circle cx="487" cy="190" r="3.5"/>
    <circle cx="514" cy="211" r="3"/><circle cx="477" cy="285" r="3.5"/>
    <circle cx="154" cy="190" r="5"/><circle cx="226" cy="205" r="4.5"/>
    <circle cx="187" cy="164" r="3.5"/><circle cx="121" cy="163" r="3.5"/>
    <circle cx="257" cy="319" r="4"/><circle cx="231" cy="263" r="3"/>
  </g>

  <g fill="none" stroke="#22d3ee" stroke-opacity="0.45">
    <circle cx="676" cy="225" r="13"/><circle cx="676" cy="225" r="21" stroke-opacity="0.2"/>
    <circle cx="154" cy="190" r="10"/><circle cx="471" cy="182" r="10"/>
    <circle cx="794" cy="343" r="10"/><circle cx="257" cy="319" r="9"/>
  </g>

  <g font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#c9d1d9">
    <text x="687" y="216">East Asia</text>
    <text x="482" y="173">Europe</text>
    <text x="165" y="181">North America</text>
    <text x="805" y="337">Oceania</text>
    <text x="268" y="313">South America</text>
  </g>

  <line x1="34" y1="396" x2="886" y2="396" stroke="#30363d"/>
  <circle cx="42" cy="413" r="3" fill="#22d3ee"/>
  <text x="53" y="417" fill="#8b949e" font-family="Segoe UI,Arial,sans-serif" font-size="10">Regional markers are reconstructed for presentation; the live counter below records new visits.</text>
</svg>
