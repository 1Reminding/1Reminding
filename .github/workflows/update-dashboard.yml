name: Update open-source dashboard

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/scripts/generate-dashboard.mjs"
      - ".github/workflows/update-dashboard.yml"

permissions:
  contents: write

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate dashboard SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: node .github/scripts/generate-dashboard.mjs

      - name: Commit changed statistics
        run: |
          if git diff --quiet -- assets/open-source-dashboard.svg; then
            echo "Dashboard is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/open-source-dashboard.svg
          git commit -m "chore: refresh profile dashboard"
          git push
